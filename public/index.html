<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호네키 쇼츠 장부</title>
<meta name="description" content="호네키 방송 다시보기의 구간별 에피소드 장부 — 몇 시쯤 어떤 이야기가 나오는지 한눈에.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1 class="brand"><span class="logo" aria-hidden="true"></span>호네키 쇼츠 장부</h1>
    <p class="sub">호네키 방송 다시보기 구간마다 어떤 에피소드가 나오는지 모았습니다. 마음에 드는 에피소드는 추천해 주세요.</p>
    <div class="tabs" role="tablist" aria-label="보기 고르기">
      <button type="button" role="tab" id="tab-ledger" aria-controls="panel-ledger" aria-selected="true">에피소드 장부</button>
      <button type="button" role="tab" id="tab-ai" aria-controls="panel-ai" aria-selected="false" tabindex="-1">AI 쇼츠 추천<span class="tab-n" id="tab-ai-n"></span></button>
    </div>
  </div>
</header>
<main class="wrap">
 <p class="notice" id="notice" hidden></p>
 <div id="panel-ledger" role="tabpanel" aria-labelledby="tab-ledger">
  <section class="overview" id="overview" aria-label="한눈에 보기"></section>
  <div class="bar" id="bar">
    <div class="search" role="search">
      <input type="search" id="q" placeholder="낱말로 찾기 — 예: 보컬학원, 회사, 유통기한" aria-label="낱말로 찾기" autocomplete="off" enterkeyhint="search">
      <button type="button" class="go" id="go" aria-label="검색"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><span>검색</span></button>
    </div>
    <select id="topic" class="topic-sel" aria-label="주제 고르기"><option value="">모든 주제</option></select>
    <div class="seg-ctl" role="group" aria-label="보기 순서">
      <button type="button" data-sort="bc" aria-pressed="true">방송별</button>
      <button type="button" data-sort="rec" aria-pressed="false">추천 많은 순</button>
    </div>
    <label class="chk"><input type="checkbox" id="onlyScore"> 점수 있는 것만</label>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list" class="list"></div>
  <div class="more-wrap"><button type="button" class="btn" id="more" hidden>더 보기</button></div>
 </div>
 <div id="panel-ai" class="ai" role="tabpanel" aria-labelledby="tab-ai" hidden></div>
</main>
<footer class="foot">
  <div class="wrap" id="foot"></div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
